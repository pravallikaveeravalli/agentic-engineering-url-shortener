openapi: 3.1.0
info:
  title: Agentic SDLC URL Shortener API
  version: 3.0.0
  description: >
    Application-plane API for the URL shortener, plus read-only control-plane inspection.
    Versioning: additive changes are MINOR; removing or narrowing a field, renaming, or changing a
    status code is MAJOR and requires a new path prefix. See plan.md section 2 for the full
    compatibility and change-approval rules.

    Redirect resolution is public and MUST NOT require authentication (FR-URL-018).
    Link creation and analytics require a creator API key.

    Control-plane operations (run creation, run inspection, gate decisions) carry NO credential. The shortener's
    actor model and the orchestrator's actor model are separate domains and no credential class crosses the
    boundary (CN-012, owner ruling 2026-09-20). Orchestrator governance surfaces sit under the machine-access
    trust boundary, as creator provisioning does (FR-URL-019).

    Redirects are TEMPORARY, never permanent — resolved at the Gate 4 closing package (DF-002, CR-003).
    A permanent redirect would be cached by clients, after which follows never reach the service, defeating
    both analytics counting (FR-URL-010) and expiry enforcement (FR-URL-008). The exact code within the
    temporary class is an implementation detail (CN-006).
servers:
  - url: http://localhost:8080
    description: Local demonstration instance

tags:
  - name: links
    description: Link creation and analytics (creator-authenticated)
  - name: redirect
    description: Public redirect resolution (never authenticated)
  - name: operations
    description: Health and readiness
  - name: orchestration
    description: Control-plane governance surfaces — run creation, inspection, and gate decisions. No credential crosses from the shortener's actor model (CN-012).

paths:
  /v1/links:
    post:
      tags: [links]
      summary: Create a short link
      operationId: createLink
      security:
        - creatorApiKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Optional marker. Absent means always mint a new code — there is no destination-based
            deduplication at any scope (FR-URL-012, CL-008).
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLinkRequest' }
            examples:
              minimal:
                summary: Destination only, default TTL applies
                value: { destination: "https://example.com/a/very/long/path?x=1" }
              withExpiry:
                summary: Caller-supplied expiry
                value:
                  destination: "https://example.com/promo"
                  expiresAt: "2026-10-19T12:00:00Z"
      responses:
        '201':
          description: Link created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
              examples:
                created:
                  value:
                    shortCode: "aB3xK9p"
                    destination: "https://example.com/promo"
                    createdAt: "2026-09-19T10:00:00Z"
                    expiresAt: "2026-10-19T12:00:00Z"
                    state: "ACTIVE"
                    replay: false
        '200':
          description: >
            Idempotent replay. Same marker and identical request content: the ORIGINAL link is
            returned as success, labelled as a replay, with zero new side effects (CL-008 case 2).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
              examples:
                replayed:
                  value:
                    shortCode: "aB3xK9p"
                    destination: "https://example.com/promo"
                    createdAt: "2026-09-19T10:00:00Z"
                    expiresAt: "2026-10-19T12:00:00Z"
                    state: "ACTIVE"
                    replay: true
        '400':
          description: >
            Validation failure — malformed, empty, over-length, or disallowed scheme; or an expiry
            already in the past. Nothing is persisted and no code is consumed (FR-URL-002).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                disallowedScheme:
                  value:
                    code: "SCHEME_NOT_ALLOWED"
                    message: "Destination scheme is not permitted."
                    detail: "Permitted schemes: http, https."
                expiryInPast:
                  value:
                    code: "EXPIRY_IN_PAST"
                    message: "expiresAt must be in the future."
        '401':
          description: >
            Missing, invalid, expired, or revoked creator credentials. Creation is never anonymous.
            Expired and revoked produce an identical response shape.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missingCredential:
                  value:
                    code: "UNAUTHENTICATED"
                    message: "A creator API key is required to create a link."
                    detail: "Link creation is authenticated; redirect resolution is public (FR-URL-018)."
        '409':
          description: >
            Idempotency conflict. Same marker with different request content: nothing is minted and
            nothing is changed (CL-008 case 3).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                conflict:
                  value:
                    code: "IDEMPOTENCY_CONFLICT"
                    message: "Marker already used with different request content."
                    detail: "An idempotency key identifies one exact logical request."
        '429':
          description: Per-creator creation rate limit exceeded (PVT-012).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                throttled:
                  value:
                    code: "RATE_LIMITED"
                    message: "Creation rate limit exceeded."
                    detail: "Tier: per-creator-creation."
        '503':
          description: Persistence unavailable. Nothing was persisted (FR-URL-014, EC-010).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                storeUnavailable:
                  value:
                    code: "STORE_UNAVAILABLE"
                    message: "The link store is not reachable."
                    detail: "Readiness fails closed rather than accepting traffic it cannot serve."

  /{shortCode}:
    get:
      tags: [redirect]
      summary: Resolve a short link and redirect
      operationId: resolveLink
      description: >
        Public and unauthenticated by design. Redirects to the exact stored destination; the target
        is never derived from request input (FR-URL-007).
      security: []
      parameters:
        - name: shortCode
          in: path
          required: true
          schema: { type: string }
      responses:
        '307':
          description: >
            Temporary redirect to the stored destination. Temporary class is required (FR-URL-007, CR-003) so
            that every follow reaches the service — analytics can count it and expiry is evaluated each time.
            A permanent-class redirect is prohibited.
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        '404':
          description: Code was never issued. Distinguishable from expired (FR-URL-008).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notFound:
                  value: { code: "CODE_NOT_FOUND", message: "No such short code." }
        '410':
          description: >
            Link has expired. Never redirects, and is distinguishable from never-issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                expired:
                  value: { code: "LINK_EXPIRED", message: "This link has expired." }
        '429':
          description: >
            Redirect rate limit exceeded on either tier — per short code (PVT-013) or per creator
            aggregated across all their links (PVT-014). The response MUST NOT disclose the owning
            creator's identity to a public follower.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                perCode:
                  value: { code: "RATE_LIMITED", message: "Too many requests.", detail: "Tier: per-code." }
                perCreatorAggregate:
                  value: { code: "RATE_LIMITED", message: "Too many requests.", detail: "Tier: per-creator-aggregate." }
        '503':
          description: >
            Persistence unavailable for a code known to exist. Distinguishable from not-found and
            from expired (EC-011).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                storeUnavailableOnRedirect:
                  value:
                    code: "STORE_UNAVAILABLE"
                    message: "The link store is not reachable."
                    detail: "A redirect cannot be resolved without the store; analytics failure alone would notcause this (EC-012)."

  /v1/links/{shortCode}/analytics:
    get:
      tags: [links]
      summary: Retrieve a link's redirect events
      operationId: getLinkAnalytics
      description: >
        Readable only by the creator that owns the link. A non-owner and an anonymous caller both
        receive a refusal that does not reveal whether the code exists (FR-URL-011, T-06).
      security:
        - creatorApiKey: []
      parameters:
        - name: shortCode
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Time-ordered redirect events. Timestamp only; no follower-identifying field exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Analytics' }
              examples:
                series:
                  value:
                    shortCode: "aB3xK9p"
                    totalRedirects: 3
                    events:
                      - occurredAt: "2026-09-19T10:05:00Z"
                      - occurredAt: "2026-09-19T10:06:12Z"
                      - occurredAt: "2026-09-19T11:00:47Z"
        '401':
          description: Missing or invalid creator credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                analyticsUnauthenticated:
                  value:
                    code: "UNAUTHENTICATED"
                    message: "A creator API key is required to read analytics."
                    detail: "Analytics are creator-scoped (FR-URL-011)."
        '404':
          description: >
            Not found OR not owned by this creator — deliberately indistinguishable, so the endpoint
            cannot be used as an ownership oracle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                analyticsNotFound:
                  value:
                    code: "NOT_FOUND"
                    message: "No link with that code belongs to this creator."
                    detail: "Scoped lookup: another creator's code reports not-found rather than forbidden, sothe response does not confirm the code exists."

  /health/live:
    get:
      tags: [operations]
      summary: Liveness
      description: Process alive. Unaffected by store availability (FR-URL-015).
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              examples:
                alive:
                  value:
                    status: "UP"

  /health/ready:
    get:
      tags: [operations]
      summary: Readiness
      description: >
        Able to serve requests. MUST fail while a required dependency is unavailable, and MUST NOT
        expose secrets, connection strings, or internal topology.
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              examples:
                ready:
                  value:
                    status: "UP"
                    checks:
                      store: "UP"
        '503':
          description: Not ready — a required dependency is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              examples:
                notReady:
                  value:
                    status: "DOWN"
                    checks:
                      store: "DOWN"

  /v1/runs:
    post:
      tags: [orchestration]
      summary: Create a workflow run from a submitted requirement
      operationId: createRun
      description: >
        Admits a requirement and creates a governed run with a durable identifier that propagates to every log,
        metric, trace, audit row and evidence artifact (FR-ORC-007, NFR-OBS-001). Stage S1.

        Carries NO credential: this is an orchestrator governance surface under the machine-access trust boundary
        (CN-012). A creator API key is neither required nor accepted here.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRunRequest' }
      responses:
        '201':
          description: Run created and persisted with its identifier
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunInspection' }
              examples:
                runCreated:
                  value:
                    runId: "0f7d2c18-6a4e-4f8b-9d3a-1c2b3e4f5a60"
                    state: "RUNNING"
                    terminalState: null
                    policySetVersion: "policy-set-1.1.0"
                    suspensionReason: null
                    autoAbandonAt: null
                    blockingCondition: null
                    nodes:
                      - nodeKey: "S1"
                        stageNumber: 1
                        nodeRole: "SINGLETON"
                        name: "Ingestion"
                        state: "SUCCEEDED"
                        executorClass: "DETERMINISTIC"
                        executorKindUsed: "DETERMINISTIC"
                        attemptsUsed: 1
                      - nodeKey: "S2"
                        stageNumber: 2
                        nodeRole: "SINGLETON"
                        name: "Normalization"
                        state: "RUNNING"
                        executorClass: "AI_CAPABLE"
                        executorKindUsed: "AI"
                        attemptsUsed: 1
        '400':
          description: Malformed submission. Nothing is persisted and no run identifier is issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                emptyRequirement:
                  value:
                    code: "INVALID_INPUT"
                    message: "A requirement is required to create a run."
                    detail: "The submitted text is treated as untrusted content throughout (ADR-004-A1)."
        '503':
          description: Store unavailable. No run is created; the caller may retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                orchestratorUnavailable:
                  value:
                    code: "STORE_UNAVAILABLE"
                    message: "Run state cannot be persisted."
                    detail: "A run is not created unless its state is durable (FR-ORC-004)."

  /v1/runs/{runId}/gates/{gateId}/decision:
    post:
      tags: [orchestration]
      summary: Record a human decision on a pending gate
      operationId: recordGateDecision
      description: >
        Records one of the four submittable outcomes against a pending gate (FR-ORC-013).

        TIMED_OUT is deliberately NOT submittable: it is produced by the gate-wait deadline expiring, never by a
        caller, and silence is never an input. Absence of a call to this operation is what produces suspension.

        repositoryRecordPath is REQUIRED: the decision's repository record must already exist in the working tree
        before the decision takes effect (Constitution v1.1.0 Gate semantics, FR-ORC-013). The contract refuses a
        decision that exists only in workflow state.

        Carries NO credential (CN-012). Actor authority is asserted from the recorded actor, and an agent actor is
        refused for any approving outcome at every autonomy setting (FR-ORC-021, EC-024).
      security: []
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
        - name: gateId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GateDecisionRequest' }
      responses:
        '200':
          description: Decision recorded; the run state reflects its effect
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunInspection' }
              examples:
                decisionRecorded:
                  value:
                    runId: "0f7d2c18-6a4e-4f8b-9d3a-1c2b3e4f5a60"
                    state: "RUNNING"
                    terminalState: null
                    policySetVersion: "policy-set-1.1.0"
                    suspensionReason: null
                    autoAbandonAt: null
                    blockingCondition: null
                    nodes:
                      - nodeKey: "S4"
                        stageNumber: 4
                        nodeRole: "SINGLETON"
                        name: "Human clarification"
                        state: "SUCCEEDED"
                        executorClass: "HUMAN_GATE"
                        executorKindUsed: "HUMAN"
                        attemptsUsed: 1
        '400':
          description: >
            Malformed decision — unknown outcome, CHANGES_REQUESTED with an empty change list, or a missing
            repositoryRecordPath.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                missingRepositoryRecord:
                  value:
                    code: "INVALID_INPUT"
                    message: "repositoryRecordPath is required and must begin with docs/governance/."
                    detail: "A gate decision is not usable until its repository record exists (CR-013)."
        '403':
          description: >
            The actor has no recorded authority for this gate class, or an agent actor attempted an approving
            outcome. Recorded as an autonomy violation (EC-024, FR-ORC-021).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                nonHumanActorRefused:
                  value:
                    code: "FORBIDDEN"
                    message: "Only a human actor may record a gate decision."
                    detail: "actorType accepts only human (CR-021). Actor identity is declared, not verified:see FR-ORC-021 for the disclosed limitation."
        '404':
          description: No such run, or no such pending gate on it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                gateNotFound:
                  value:
                    code: "NOT_FOUND"
                    message: "No open gate with that identifier on this run."
        '409':
          description: >
            The gate already carries a decision. Gate decisions are append-only and corrected by a superseding
            record, never overwritten (Compensation Register).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                gateAlreadyDecided:
                  value:
                    code: "CONFLICT"
                    message: "That gate already carries a recorded decision."
                    detail: "A decision is not replaceable; a changed decision is a new record referencing theprior one."

  /v1/runs/{runId}:
    get:
      tags: [orchestration]
      summary: Inspect a workflow run
      operationId: inspectRun
      description: >
        Per-stage status, graph position, parallel and join structure, blocking condition, retry
        history, pending gates, and — when suspended — the computed auto-abandon-at (FR-ORC-008,
        FR-ORC-032).

        Carries NO credential (CN-012). A creator API key is neither required nor accepted: run inspection is an
        orchestrator governance surface, and creators are a URL-shortener concept that must not leak into the
        orchestrator (owner ruling, 2026-09-20).
      security: []
      parameters:
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunInspection' }
              examples:
                suspendedRun:
                  value:
                    runId: "0f7d2c18-6a4e-4f8b-9d3a-1c2b3e4f5a60"
                    state: "SAFE_STOP"
                    terminalState: null
                    policySetVersion: "policy-set-1.1.0"
                    suspensionReason: "Awaiting human clarification at stage 4."
                    autoAbandonAt: "2026-12-20T12:00:00Z"
                    blockingCondition: null
                    nodes:
                      - nodeKey: "S4"
                        stageNumber: 4
                        nodeRole: "SINGLETON"
                        name: "Human clarification"
                        state: "AWAITING_APPROVAL"
                        executorClass: "HUMAN_GATE"
                        executorKindUsed: null
                        attemptsUsed: 0
        '404':
          description: No such run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                runNotFound:
                  value:
                    code: "NOT_FOUND"
                    message: "No run with that identifier."

components:
  securitySchemes:
    creatorApiKey:
      type: http
      scheme: bearer
      description: >
        Creator credential presented as `Authorization: Bearer <key>`.

        Standard bearer transport is chosen deliberately: proxies, frameworks and log scrubbers redact the
        Authorization header by default, whereas a custom header receives no such default protection. This is
        free reduction of exactly the leak risk FR-URL-017 treats as non-waivable.

        Key form: `crk_` + base64url of at least 256 CSPRNG bits. The prefix makes a leaked key identifiable on
        sight and gives the POL-SEC-002 secret scan a deterministic pattern to match; it carries no information
        and does not reduce entropy. The stored form is SHA-256 of the full presented string, prefix included.

        Provisioned by the local operator script only; there is no HTTP issuance endpoint (FR-URL-019). The
        script requires an expiry parameter — a duration, or the explicit literal `never`; there is no default.
        Never logged by the application at any level.

        Expired and revoked credentials are refused with an identical response shape, so a caller learns
        nothing from the distinction.

  schemas:
    CreateRunRequest:
      type: object
      required: [requirement]
      additionalProperties: false
      properties:
        requirement:
          type: string
          minLength: 1
          maxLength: 20000
          description: >
            The requirement text to govern. Treated as UNTRUSTED CONTENT throughout: it reaches AI stages as prompt
            input, so the CLI adapter MUST pass it as an argv element and never as a shell string (ADR-004-A1).

    GateDecisionRequest:
      type: object
      required: [outcome, actorType, actorName, reason, repositoryRecordPath]
      additionalProperties: false
      properties:
        outcome:
          type: string
          enum: [APPROVED, REJECTED, CHANGES_REQUESTED, ESCALATED]
          description: >
            Four submittable outcomes. TIMED_OUT is absent by design — it is produced by deadline expiry, never
            submitted, because silence must never be expressible as an input (Constitution III).
        actorType:
          type: string
          enum: [human]
          description: >
            Only a human may submit a gate decision. The system actor is permitted solely for deadline expiry and
            retention-driven abandonment, neither of which is an approval and neither of which uses this operation.
        actorName: { type: string, minLength: 1 }
        reason:
          type: string
          minLength: 1
          description: Mandatory. A decision without a reason is not a gate record.
        repositoryRecordPath:
          type: string
          pattern: '^docs/governance/'
          description: >
            Path to the decision's materialized repository record, which MUST already exist. Writing that record is
            not itself work the decision authorizes, so this rule cannot deadlock (FR-ORC-013).
        changes:
          type: array
          items: { type: string, minLength: 1 }
          description: Required and non-empty when outcome is CHANGES_REQUESTED; the changes are enumerated, never implied.
        noPlanOption:
          type: string
          enum: [GOVERNANCE_ONLY, HUMAN_IMPLEMENTED, ABANDON]
          description: >
            Required only on the no-change-plan gate class (FR-ORC-031, CR-001). HUMAN_IMPLEMENTED records
            executorKindUsed HUMAN on the implementation node.

    CreateLinkRequest:
      type: object
      required: [destination]
      additionalProperties: false
      properties:
        destination:
          type: string
          format: uri
          maxLength: 2048
          description: Allow-listed scheme only. Normalized before validation and storage.
        expiresAt:
          type: string
          format: date-time
          description: Must be in the future. Defaults to PVT-011 when omitted.

    Link:
      type: object
      required: [shortCode, destination, createdAt, expiresAt, state, replay]
      additionalProperties: false
      properties:
        shortCode: { type: string }
        destination: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        state: { type: string, enum: [ACTIVE, EXPIRED] }
        replay:
          type: boolean
          description: True when this response is an idempotent replay of an earlier request.

    Analytics:
      type: object
      required: [shortCode, totalRedirects, events]
      additionalProperties: false
      properties:
        shortCode: { type: string }
        totalRedirects: { type: integer, minimum: 0 }
        events:
          type: array
          items:
            type: object
            required: [occurredAt]
            additionalProperties: false
            properties:
              occurredAt: { type: string, format: date-time }
          description: >
            Timestamp only. No IP, user agent, referrer, device identifier, or geolocation field
            exists anywhere in the system (NFR-SEC-005, POL-PRIV-001).

    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [UP, DOWN] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [UP, DOWN] }
          description: Dependency names and states only. Never connection details.

    RunInspection:
      type: object
      required: [runId, state, policySetVersion, nodes]
      additionalProperties: false
      properties:
        runId: { type: string }
        state:
          type: string
          enum: [PENDING, RUNNING, SAFE_STOP, COMPLETED, REJECTED, ABANDONED]
        terminalState:
          type: [string, 'null']
          enum: [COMPLETED, REJECTED, ABANDONED, null]
          description: Null while suspended — a suspended run has no terminal outcome (CL-005).
        policySetVersion: { type: string }
        suspensionReason: { type: [string, 'null'] }
        autoAbandonAt:
          type: [string, 'null']
          format: date-time
          description: Non-null iff state is SAFE_STOP.
        blockingCondition: { type: [string, 'null'] }
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [nodeKey, stageNumber, nodeRole, name, state, executorClass]
            properties:
              nodeKey:
                type: string
                pattern: '^S([1-9]|1[0-2])(\.([1-9][0-9]*|join))?$'
              stageNumber: { type: integer, minimum: 1, maximum: 12 }
              nodeRole: { type: string, enum: [SINGLETON, FAN_OUT_PARENT, FAN_OUT_CHILD, JOIN] }
              parentNodeKey: { type: [string, 'null'] }
              name: { type: string }
              state:
                type: string
                enum: [BLOCKED, READY, RUNNING, AWAITING_APPROVAL, RETRY_WAIT, FALLBACK,
                       ROLLING_BACK, COMPENSATING, SUCCEEDED, FAILED, INVALIDATED, SKIPPED]
              executorClass: { type: string, enum: [DETERMINISTIC, AI_CAPABLE, HUMAN_GATE] }
              executorKindUsed:
                type: [string, 'null']
                enum: [DETERMINISTIC, AI, HUMAN, null]
                description: >
                  Executor kind actually used. Required on every executed node (FR-ORC-029). HUMAN is recorded
                  for a node the human implemented under the no-plan gate (FR-ORC-031); it is never
                  flag-selectable.
              attemptsUsed: { type: integer, minimum: 0 }
              dependsOn:
                type: array
                items: { type: string }
                description: Node keys this node depends on, with join semantics carried on the edge (FR-ORC-003).
        pendingGate:
          type: [object, 'null']
          additionalProperties: false
          required: [gateId, nodeKey, gateClass, waitDeadline, disclosedAutoAbandonAt]
          properties:
            gateId: { type: string, description: Addresses this gate in the decision operation. }
            nodeKey: { type: string, description: The node the gate is attached to. }
            gateClass: { type: string }
            waitDeadline: { type: string, format: date-time }
            disclosedAutoAbandonAt: { type: string, format: date-time }
          description: >
            Both deadlines are disclosed at request time, so the person being asked sees the expiry
            consequence in the ask itself (CL-005 addendum).

    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code: { type: string }
        message: { type: string }
        detail:
          type: string
          description: >
            Must never echo raw input in a way that enables injection, and must never contain
            secrets, credentials, or storage internals (FR-URL-002, FR-URL-017).
