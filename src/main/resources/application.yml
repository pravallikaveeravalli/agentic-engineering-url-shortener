# Secure configuration defaults. Task T018.
#
# plan §8 names three: throttling on, verbose error detail off, readiness fails closed.
# There is NO mode flag (ADR-004 Amendment 02 / CR-028) — the former `ai: off` default is gone with
# the flag itself, which is why this file names three defaults and not four.
#
# Each default is asserted by SecureDefaultsTest. A default that is only written here is a comment.

spring:
  application:
    name: agentic-sdlc-url-shortener
  datasource:
    url: jdbc:postgresql://localhost:5432/shortener
    username: shortener
    password: shortener
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema (ADR-002). Hibernate may check, never create.
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  error:
    # Verbose error detail OFF. A stack trace or message on an error response leaks internals to an
    # unauthenticated caller, and the redirect surface is public by design (FR-URL-018).
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        # Liveness and readiness only. Every other actuator endpoint stays closed: an open env or
        # configprops endpoint would expose the datasource credential.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

shortener:
  ratelimit:
    # Throttling ON by default. FR-URL-016 is two-sided, three-tier -- all three now enforced. T136a
    # closed the third tier (per-creator aggregate redirects, PVT-014); see docs/delivery/baseline-
    # omissions.md entry 1 for the deferral this closes.
    enabled: true
    creation-per-creator-per-minute: 60
    redirect-per-code-per-minute: 600
    aggregate-per-creator-per-minute: 3000
  # own-hosts — this service's own host names, for EC-005: a destination pointing back into our own
  # short-link space is a redirect chain or a loop, and FR-URL-005 refuses it.
  #
  # A DEPLOYMENT MUST SET ITS REAL PUBLIC HOST HERE. The value below is the local default and is not a
  # security decision. AbuseGuard refuses to be constructed from an empty set, so the check can never
  # be silently vacuous — but it cannot detect a set that is non-empty and wrong, which is why this
  # comment is here and not only in the class.
  #
  # A comma-separated scalar rather than a YAML sequence: @Value binds a scalar reliably, while a
  # sequence needs @ConfigurationProperties, which would put a framework annotation on the path to a
  # domain type for no gain.
  own-hosts: localhost
  readiness:
    # Readiness FAILS CLOSED. If the store cannot be reached, the instance reports not-ready rather
    # than accepting traffic it cannot serve. Failing open would make a broken instance look healthy,
    # which is the failure mode this default exists to prevent.
    fail-closed: true
  # claude-cli — the pinned transport for the ONE StageAiProvider seam (ADR-004-A1, T073).
  #
  # Deliberately NOT under `shortener.ai`: SecureDefaultsTest asserts that whole namespace absent,
  # because ADR-004 Amendment 02 (CR-028, Decision J) removed the run-level `ai: on|off` MODE toggle
  # and the test's job is to make sure it never quietly reappears. This is a different kind of value —
  # which binary, which model — with no on/off semantic at all, so it lives in its own namespace rather
  # than risk that assertion ever being read as "no AI configuration of any kind may exist".
  claude-cli:
    # Resolved via PATH in production. A deployment without the CLI installed classifies every AI-stage
    # invocation UNAVAILABLE (ADR-004-A1's risk table) — AI mode degrades; it never fails the run.
    command: claude
    # PLACEHOLDER, like own-hosts above: a deployment MUST verify this against the actually installed
    # CLI's accepted --model values before an AI-mode run. The model id recorded in evidence is read
    # FROM the response, never from this pin (FR-ORC-029) — so a stale or wrong pin here cannot corrupt
    # the evidence trail, only the choice of which model answers.
    pinned-model: claude-sonnet-5
